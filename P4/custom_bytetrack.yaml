# custom_bytetrack.yaml

tracker_type: bytetrack

# Umbrales de detección
track_high_thresh: 0.35
track_low_thresh: 0.10
new_track_thresh: 0.35

# Mantener IDs durante más tiempo
track_buffer: 150

# Asociación entre detecciones
match_thresh: 0.8

# Fusionar información de confianza
fuse_score: True